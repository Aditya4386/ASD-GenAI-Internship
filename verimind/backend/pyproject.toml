[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verimind-backend"
version = "1.0.0"
description = "Multi-Agent Document Intelligence Platform - Backend API"
readme = "../README.md"
license = {text = "MIT"}
authors = [
    {name = "VeriMind Team", email = "team@verimind.ai"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "python-dotenv==1.0.1",
    "pypdf==4.0.1",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "langchain==1.4.3",
    "langchain-groq==1.1.3",
    "langchain-huggingface==1.2.2",
    "langchain-community==0.4.2",
    "langgraph==1.2.11",
    "faiss-cpu==1.15.1",
    "pydantic==2.8.2",
    "python-multipart==0.0.9",
    "scikit-learn==1.6.1",
    "numpy==2.2.6",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "black==24.4.0",
    "isort==5.13.0",
    "flake8==7.0.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/verimind"
Repository = "https://github.com/yourusername/verimind"
Issues = "https://github.com/yourusername/verimind/issues"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "agent: Agent-specific tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = ["B101", "B601"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default args
]
# per-file-ignores = {
#     "tests/*" = ["S101", "S106"],
# }