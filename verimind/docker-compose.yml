version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Bug Fix #5: Corrected model name from openai/oss/120b → openai/gpt-oss-120b
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      # For production, set this to your frontend domain, e.g. https://verimind.onrender.com
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vectorstore:/app/vectorstore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the backend URL at build time so Vite bakes it into the bundle
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      # Bug Fix #6: Frontend now listens on port 80 inside the container
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Redis for LangGraph checkpointing (enable with --profile production)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data: